services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: sutra-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TINYFISH_API_KEY
        sync: false   # set this in Render dashboard → Environment
      - key: CLIENT_URL
        sync: false   # set to your deployed frontend URL

  # ── Frontend ───────────────────────────────────────────────────────────────
  - type: web
    name: sutra-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
